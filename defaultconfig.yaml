# Copy settings to snakeconfig.yaml to override these defaults.
# In batches mode, processing options can also be overridden inside a batch.
# Replace a complete *_args string when changing its command-line options.

# Configure batches.<batch>.modality as cDNA, gDNA, or both in snakeconfig.yaml.
# Without batches, use top-level modality; when omitted, infer cDNA from
# star_umite or gDNA from biscuit_methscan for existing configurations.
# cDNA uses star_umite; gDNA uses biscuit_methscan. For both, use star_umite.
pipeline: star_umite

# Input/output roots default to data/ and results/ beside Snakefile.
# Optional datadir and outdir overrides in snakeconfig.yaml must be absolute.
# Batch metadata is discovered in data/<batch>/<modality>/ and reads in fastq/.
# Batch ilse_info.cDNA and ilse_info.gDNA sections override those locations.
# Without batches, the existing data/<modality>/ layout remains supported.
# Shared reference.star_index (directory) and reference.biscuit_index (prefix)
# reuse supplied indexes; omit them to build indexes under each batch result.

# Set arguments for umiextract 
# umilen: length of umi in your library preparation
# anchor: anchor sequence preceding the umi 
# trailing: sequence after UMI
# search region: size of search interval from start of a read to find the umi
# fuzzy umi: allow fuzzy umi alignment to permit minor replication errors
umiextract_args: >-
  --umilen 8
  --anchor "ATTGCGCAATG"
  --trailing "GGG"
  --search_region 30
  --fuzzy_umi

# Set arguments for umicount 
# mm_count_primary: count primary alignment (BAM flag 0x100) for multimapping reads
# UMI_correct: Allows minor misalignments when matching UMIs 
umicount_args: >-
  --mm_count_primary
  --UMI_correct

# Star index building parameters
# limitGenomeGenerateRAM: Maximum RAM this process can occupy
star_index_args: >-
  --limitGenomeGenerateRAM 100000000000

# Star Alignment parameters
# clip3pAdapterSeq Sequencing adapter sequences 
# clip3pAdapterMMp: fraction of mismatch allowed in Adapter sequences
# readFilesCommand: tautological
# outSAMtype: output file type, don't change 
star_align_args: >-
  --clip3pAdapterSeq CTGTCTCTTATACACATCT CTGTCTCTTATACACATCT
  --clip3pAdapterMMp 0.1 0.1
  --readFilesCommand zcat
  --outSAMtype BAM Unsorted

# Biscuit genome index parameters
# -a: Algorithm used to build the index, bwtsw is default, for very small genomes use div
biscuit_index_alg: >-
  -a bwtsw

# Biscuit alignment index parameters
# -T: Minimum score to output
# -k: Minimum seed length
biscuit_align_args: >-
  -T 30
  -k 19

# Methscan arguments are strings passed as command-line options.
# The workflow supplies input/output paths and threads; do not include those here.
# Keep input-format biscuit_short for the BISCUIT BED files produced upstream.
methscan_prepare_args: >-
  --input-format biscuit_short

# Cell filtering thresholds; these retain the pipeline's existing defaults.
# Optional --cell-names requires an existing absolute file path. Changes to this
# tracked input file trigger filtering again.
methscan_filter_args: >-
  --min-sites 50000
  --min-meth 40
  --max-meth 90

# Empty strings use Methscan's defaults for the remaining options.
methscan_smooth_args: ""
# --write-header is unsupported: the matrix step requires BED without a header.
methscan_scan_args: ""
# --sparse is unsupported: H5AD conversion requires CSV matrix output.
methscan_matrix_args: ""
